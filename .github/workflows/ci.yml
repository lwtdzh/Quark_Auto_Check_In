name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装测试依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 检查 Python 语法
        run: python -m compileall -q checkIn_Quark.py tests

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  enable-schedules:
    name: 启用定时工作流
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 启用每日签到和每月保活
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow enable quark_signin.yml
          gh workflow enable empty-commit-keepalive.yml
          gh api "repos/${GH_REPO}/actions/workflows" \
            --jq '.workflows[] | "\(.name): \(.state)"'
