name: 夸克网盘每日签到

on:
  schedule:
    - cron: "22 1 * * *" # 北京时间 09:22
    - cron: "21 5 * * *" # 北京时间 13:21，失败兜底
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 获取北京时间日期
        id: date
        shell: bash
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 恢复今日各账号成功记录
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin/accounts.json
          key: quark-accounts-v1-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            quark-accounts-v1-${{ steps.date.outputs.today }}-

      - name: 随机延迟
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            max_delay=10
          else
            max_delay=60
          fi
          delay=$((RANDOM % (max_delay + 1)))
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 执行签到脚本
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          SERVER_CHAN_SEND_KEY: ${{ secrets.SERVER_CHAN_SEND_KEY }}
          QUARK_SUCCESS_CACHE: .cache/quark-signin/accounts.json
        run: python -u checkIn_Quark.py

      - name: 保存今日各账号成功记录
        if: always() && hashFiles('.cache/quark-signin/accounts.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin/accounts.json
          key: ${{ steps.cache-success.outputs.cache-primary-key }}
